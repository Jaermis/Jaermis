name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"      # regenerate once a day
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Compact top-languages donut (fixes the broken/oversized stats card)
      - name: Top languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Jaermis
          template: classic
          base: "header"
          config_timezone: Asia/Manila
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      # Isometric activity calendar, rendered at a fixed size in the README so it stays compact
      - name: Activity calendar
        uses: lowlighter/metrics@latest
        with:
          filename: activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Jaermis
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
